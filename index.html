
<!DOCTYPE html>

<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Elder Zach's 70th Birthday | Find Your Table</title>

<style>

:root {

  --blue: #102f75;

  --silver: #d9e0ed;

}

* { box-sizing: border-box; }

body {

  margin: 0;

  min-height: 100vh;

  font-family: Arial, sans-serif;

  background: linear-gradient(145deg, #0b2053, #2454a4);

  color: #172b50;

  display: flex;

  justify-content: center;

  align-items: center;

  padding: 22px;

}

main {

  width: 100%;

  max-width: 520px;

  background: white;

  border: 5px solid var(--silver);

  border-radius: 22px;

  padding: 28px 20px;

  text-align: center;

  box-shadow: 0 12px 35px #0004;

}

.crown { font-size: 42px; }

h1 { color: var(--blue); margin: 8px 0; }

.subtitle { color: #61708c; }

label { display: block; text-align: left; margin: 22px 0 7px; font-weight: bold; }

input {

  width: 100%;

  padding: 15px;

  border: 2px solid #cbd5e5;

  border-radius: 10px;

  font-size: 17px;

}

button {

  width: 100%;

  padding: 15px;

  margin-top: 12px;

  background: var(--blue);

  color: white;

  border: 0;

  border-radius: 10px;

  font-size: 17px;

  font-weight: bold;

}

#result { margin-top: 20px; }

.table-card {

  padding: 20px 10px;

  border: 2px solid var(--silver);

  border-radius: 14px;

  background: #f4f7fc;

}

.table-number { font-size: 38px; color: var(--blue); font-weight: bold; }

.table-name { font-size: 23px; font-weight: bold; margin-top: 8px; }

.note { font-size: 13px; color: #66738b; margin-top: 22px; }

</style>

</head>

<body>

<main>

  <div class="crown">♛</div>

  <h1>Elder Zach Turns 70!</h1>

  <p class="subtitle">A royal celebration of a remarkable life</p>

  <h2>Find Your Table</h2>

  <p>Welcome! Enter your name below to find your seat.</p>

  <form id="searchForm">

    <label for="guestName">Your name</label>

    <input id="guestName" type="text" placeholder="Enter your name" autocomplete="name" required>

    <button type="submit">Find My Table</button>

  </form>

  <div id="result" aria-live="polite"></div>

  <p class="note">Elder Zach's 70th Birthday Celebration<br>With love, family and friends</p>

</main>

document.getElementById("searchForm").addEventListener("submit", function(event) {

  event.preventDefault();

  const query = document.getElementById("guestName").value.trim().toLocaleLowerCase();

  const matches = [];

  tables.forEach(table => table.guests.forEach(guest => {

    if (guest.toLocaleLowerCase() === query) matches.push({guest,table});

  }));

  const result = document.getElementById("result");

  if (matches.length === 1) {

    const match = matches[0];

    result.innerHTML = '<div class="table-card"><p>Your table is</p><div class="table-number">Table ' + match.table.number + '</div><div class="table-name">' + match.table.name + '</div><p>Enjoy the celebration!</p></div>';

  } else if (matches.length > 1) {

    result.innerHTML = '<p>We found more than one guest with that name. Please enter your full name or ask a member of the event team for help.</p>';

  } else {

    result.innerHTML = '<p>We could not find that exact name. Please check the spelling or ask a member of the event team for help.</p>';

  }

});

</script>

</body>

</html>
